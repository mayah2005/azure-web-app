[project]
name = "azure-web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maya", email = "maya.hoffmann@drake.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-restful>=0.3.10",
    "gunicorn>=26.2.0",
    "mssql-python>=1.16.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
launch-app = "azure_web_app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
